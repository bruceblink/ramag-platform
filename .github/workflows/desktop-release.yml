name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "已有的 v* 附注标签"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read
  actions: read

concurrency:
  group: desktop-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: desktop-release
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout release workflow source and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.workflow_sha }}

      - name: Select verified Desktop CI artifacts
        id: ci
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          bash scripts/find-desktop-ci-artifacts.sh "$RELEASE_TAG" "$GH_REPO" "$GITHUB_OUTPUT"

      - name: Generate release notes from commit range
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          bash scripts/generate-release-notes.sh "$RELEASE_TAG" "$GH_REPO" release-assets/release-notes.md

      - name: Download verified Windows package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ramag-windows-${{ steps.ci.outputs.commit }}
          run-id: ${{ steps.ci.outputs.run_id }}
          github-token: ${{ github.token }}
          path: release-input/windows

      - name: Download verified macOS package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ramag-macos-${{ steps.ci.outputs.commit }}
          run-id: ${{ steps.ci.outputs.run_id }}
          github-token: ${{ github.token }}
          path: release-input/macos

      - name: Download verified Linux packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ramag-linux-${{ steps.ci.outputs.commit }}
          run-id: ${{ steps.ci.outputs.run_id }}
          github-token: ${{ github.token }}
          path: release-input/linux

      - name: Verify and combine release assets
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          windows="Ramag-$version-windows-x64-setup.exe"
          macos="Ramag-$version-macos-arm64.dmg"
          deb="Ramag-$version-linux-amd64.deb"
          appimage="Ramag-$version-linux-x86_64.AppImage"

          collect_assets() {
            local platform="$1"
            shift
            (
              cd "release-input/$platform"
              # Compare hashes for the exact expected files before bringing
              # any artifact contents into the publish directory.
              sha256sum -- "$@" | diff --strip-trailing-cr -u SHA256SUMS.txt -
              cp -- "$@" ../../release-assets/
            )
          }

          collect_assets windows "$windows"
          collect_assets macos "$macos"
          collect_assets linux "$deb" "$appimage"
          cd release-assets
          sha256sum -- "$windows" "$macos" "$deb" "$appimage" >SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MANUAL_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          cd release-assets
          shopt -s nullglob
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$MANUAL_RELEASE_TAG"
          else
            tag="$GITHUB_REF_NAME"
          fi
          if [[ "$tag" != v* || "$tag" == "v" ]]; then
            echo "Release tag must start with v and contain a version: $tag" >&2
            exit 1
          fi

          installers=(Ramag-*-windows-x64-setup.exe)
          [[ ${#installers[@]} -eq 1 ]]
          version="${installers[0]#Ramag-}"
          version="${version%-windows-x64-setup.exe}"
          if [[ "$tag" != "v$version" ]]; then
            echo "Release tag $tag does not match packaged version $version." >&2
            exit 1
          fi
          for expected_asset in \
            "Ramag-$version-macos-arm64.dmg" \
            "Ramag-$version-linux-amd64.deb" \
            "Ramag-$version-linux-x86_64.AppImage"; do
            if [[ ! -f "$expected_asset" ]]; then
              echo "Release asset version mismatch: $expected_asset is missing." >&2
              exit 1
            fi
          done

          notes="$(<release-notes.md)"
          if [[ -z "${notes//[[:space:]]/}" ]]; then
            echo "Generated release notes are empty for $tag." >&2
            exit 1
          fi

          tag_ref=$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '.object.type + " " + .object.sha')
          read -r tag_object_type tag_object_sha <<<"$tag_ref"
          if [[ "$tag_object_type" != "tag" || "$tag_object_sha" != "$(git rev-parse "refs/tags/$tag")" ]]; then
            echo "Remote release tag $tag differs from the annotated tag used to select CI artifacts." >&2
            exit 1
          fi

          manifest_assets='[]'
          for asset in \
            Ramag-*-windows-x64-setup.exe \
            Ramag-*-macos-arm64.dmg \
            Ramag-*-linux-amd64.deb \
            Ramag-*-linux-x86_64.AppImage; do
            hash=$(awk -v asset="$asset" '$2 == asset { print $1 }' SHA256SUMS.txt)
            [[ "$hash" =~ ^[0-9a-f]{64}$ ]]
            size=$(stat --format='%s' "$asset")
            manifest_assets=$(jq -c \
              --arg name "$asset" \
              --argjson size "$size" \
              --arg sha256 "$hash" \
              '. + [{name: $name, size: $size, sha256: $sha256}]' \
              <<<"$manifest_assets")
          done
          previous_tag=$(gh release view --repo "$GH_REPO" --json tagName --jq .tagName 2>/dev/null || true)
          previous_dir="$GITHUB_WORKSPACE/release-input/previous"
          mkdir -p "$previous_dir"
          if [[ -n "$previous_tag" && "$previous_tag" != "$tag" ]] &&
             gh release download "$previous_tag" --repo "$GH_REPO" \
               --pattern update-manifest.json --dir "$previous_dir" &&
             sudo apt-get update && sudo apt-get install --yes --no-install-recommends bsdiff; then
            assets_file="$GITHUB_WORKSPACE/release-input/update-assets.json"
            printf '%s\n' "$manifest_assets" >"$assets_file"
            if bash "$GITHUB_WORKSPACE/scripts/generate-update-deltas.sh" \
              "$previous_tag" "$previous_dir" "$PWD" "$assets_file"; then
              manifest_assets=$(<"$assets_file")
            else
              echo '::warning::Delta generation failed; publishing complete installers only.'
              rm -f -- Ramag-*.bsdiff
              sha256sum Ramag-*-windows-x64-setup.exe Ramag-*-macos-arm64.dmg \
                Ramag-*-linux-amd64.deb \
                Ramag-*-linux-x86_64.AppImage >SHA256SUMS.txt
            fi
            sha256sum --check SHA256SUMS.txt
          fi
          jq -n \
            --argjson schema_version 1 \
            --arg version "$version" \
            --arg tag_name "$tag" \
            --arg notes "$notes" \
            --arg published_at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --argjson assets "$manifest_assets" \
            '{
              schema_version: $schema_version,
              version: $version,
              tag_name: $tag_name,
              notes: $notes,
              published_at: $published_at,
              assets: $assets
            }' >update-manifest.json
          jq -e '.schema_version == 1 and (.assets | length) == 4' \
            update-manifest.json >/dev/null
          assets=(
            "${installers[0]}"
            "Ramag-$version-macos-arm64.dmg"
            "Ramag-$version-linux-amd64.deb"
            "Ramag-$version-linux-x86_64.AppImage"
            SHA256SUMS.txt
            update-manifest.json
          )
          delta_assets=(Ramag-*.bsdiff)
          assets+=("${delta_assets[@]}")

          run_release_command() {
            local label="$1"
            shift
            local output status
            output=$("$@" 2>&1) || {
              status=$?
              output="${output//'%'/'%25'}"
              output="${output//$'\n'/'%0A'}"
              output="${output//$'\r'/'%0D'}"
              echo "::error title=$label::$output"
              return "$status"
            }
            printf '%s\n' "$output"
          }

          title="Ramag ${tag#v}"

          if is_draft=$(gh release view "$tag" --repo "$GH_REPO" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$is_draft" != "true" ]]; then
              echo "Release $tag is already published; refusing to replace public assets." >&2
              exit 1
            fi
            # A failed previous run may have left an incomplete draft. Start
            # from a clean draft so stale assets cannot affect this release.
            run_release_command "Delete incomplete draft release" \
              gh release delete "$tag" --repo "$GH_REPO" --yes
            is_draft=""
          fi

          if [[ -z "$is_draft" ]]; then
            # gh release create stages the assets as a draft and publishes the
            # release after the upload succeeds.
            release_flags=(--verify-tag --notes-file release-notes.md --title "$title")
            if [[ "$tag" == *-* ]]; then
              release_flags+=(--prerelease)
            fi
            run_release_command "Create GitHub release" \
              gh release create "$tag" --repo "$GH_REPO" "${release_flags[@]}" "${assets[@]}"
          else
            run_release_command "Upload GitHub release assets" \
              gh release upload "$tag" "${assets[@]}" --repo "$GH_REPO" --clobber
            run_release_command "Update GitHub release metadata" \
              gh release edit "$tag" --repo "$GH_REPO" --title "$title" --notes-file release-notes.md
            run_release_command "Publish GitHub release draft" \
              gh release edit "$tag" --repo "$GH_REPO" --draft=false
          fi
