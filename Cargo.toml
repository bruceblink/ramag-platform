[workspace]
resolver = "3"
members = [
    "crates/ramag-domain",
    "crates/ramag-app",
    "crates/ramag-infra-mysql",
    "crates/ramag-infra-postgres",
    "crates/ramag-infra-sqlite",
    "crates/ramag-infra-redis",
    "crates/ramag-infra-mongodb",
    "crates/ramag-infra-sql-shared",
    "crates/ramag-infra-storage",
    "crates/ramag-infra-git",
    "crates/ramag-infra-clipboard",
    "crates/ramag-infra-tunnel",
    "crates/ramag-infra-ssh",
    "crates/ramag-infra-object-storage",
    "crates/ramag-infra-update",
    "crates/ramag-infra-kafka",
    "crates/ramag-infra-mqtt",
    "crates/ramag-infra-api",
    "crates/ramag-infra-container-docker",
    "crates/ramag-infra-container-registry",
    "crates/ramag-terminal",
    "crates/ramag-tool-dbclient",
    "crates/ramag-tool-api",
    "crates/ramag-tool-kafka",
    "crates/ramag-tool-mqtt",
    "crates/ramag-tool-redis",
    "crates/ramag-tool-mongodb",
    "crates/ramag-tool-vcs",
    "crates/ramag-tool-clipboard",
    "crates/ramag-tool-ssh",
    "crates/ramag-tool-object-storage",
    "crates/ramag-tool-container",
    "crates/ramag-tool-system",
    "crates/ramag-ui",
    "crates/ramag-bin",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
authors = ["axemc"]
license = "Apache-2.0"
rust-version = "1.91"
repository = "https://github.com/bruceblink/ramag-platform"

[workspace.dependencies]
# 内部 crate
ramag-domain = { path = "crates/ramag-domain" }
ramag-app = { path = "crates/ramag-app" }
ramag-infra-mysql = { path = "crates/ramag-infra-mysql" }
ramag-infra-postgres = { path = "crates/ramag-infra-postgres" }
ramag-infra-sqlite = { path = "crates/ramag-infra-sqlite" }
ramag-infra-redis = { path = "crates/ramag-infra-redis" }
ramag-infra-mongodb = { path = "crates/ramag-infra-mongodb" }
ramag-infra-sql-shared = { path = "crates/ramag-infra-sql-shared" }
ramag-infra-storage = { path = "crates/ramag-infra-storage" }
ramag-infra-git = { path = "crates/ramag-infra-git" }
ramag-infra-clipboard = { path = "crates/ramag-infra-clipboard" }
ramag-infra-tunnel = { path = "crates/ramag-infra-tunnel" }
ramag-infra-ssh = { path = "crates/ramag-infra-ssh" }
ramag-infra-object-storage = { path = "crates/ramag-infra-object-storage" }
ramag-infra-update = { path = "crates/ramag-infra-update" }
ramag-infra-kafka = { path = "crates/ramag-infra-kafka" }
ramag-infra-mqtt = { path = "crates/ramag-infra-mqtt" }
ramag-infra-api = { path = "crates/ramag-infra-api" }
ramag-infra-container-docker = { path = "crates/ramag-infra-container-docker" }
ramag-infra-container-registry = { path = "crates/ramag-infra-container-registry" }
ramag-terminal = { path = "crates/ramag-terminal" }
ramag-tool-dbclient = { path = "crates/ramag-tool-dbclient" }
ramag-tool-api = { path = "crates/ramag-tool-api" }
ramag-tool-kafka = { path = "crates/ramag-tool-kafka" }
ramag-tool-mqtt = { path = "crates/ramag-tool-mqtt" }
ramag-tool-redis = { path = "crates/ramag-tool-redis" }
ramag-tool-mongodb = { path = "crates/ramag-tool-mongodb" }
ramag-tool-vcs = { path = "crates/ramag-tool-vcs" }
ramag-tool-clipboard = { path = "crates/ramag-tool-clipboard" }
ramag-tool-ssh = { path = "crates/ramag-tool-ssh" }
ramag-tool-object-storage = { path = "crates/ramag-tool-object-storage" }
ramag-tool-container = { path = "crates/ramag-tool-container" }
ramag-tool-system = { path = "crates/ramag-tool-system" }
ramag-ui = { path = "crates/ramag-ui" }

# macOS FFI（剪贴板驱动；与 gpui_macos 同款绑定与版本，依赖树内已有零新增编译单元）
objc = "0.2"
cocoa = "0.26"
core-graphics = "0.24"
core-foundation = "0.10"

# GPUI Kit：统一 GPUI、平台、组件库和默认 Assets 的发布版依赖入口。
# tree-sitter-languages 保留 VCS、SQL 和 Markdown 编辑器所需的语法支持。
gpui-kit = { version = "0.6.6", features = [
    "tree-sitter-languages",
] }

# Markdown 预览中解析仓库内相对链接与图片路径
url = "2.5"

# SQL 数据库驱动
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "mysql",
    "sqlite",
    "chrono",
    "uuid",
    "json",
] }

# Redis 驱动
# tokio-rustls-comp + connection-manager 缺一不可：缺前者编译失败、缺后者无自动重连
redis = { version = "0.32", default-features = false, features = [
    "aio",
    "tokio-comp",
    "tokio-rustls-comp",
    "tls-rustls-webpki-roots",
    "connection-manager",
] }

# Git：gitoxide 纯 Rust 实现
gix = { version = "0.74", default-features = false, features = [
    "max-performance-safe",
    "blocking-network-client",
    "blocking-http-transport-reqwest-rust-tls",
    "revision",
    "blob-diff",
    "status",
] }

# MongoDB：官方驱动 + BSON。bson-2 与 workspace 单独 bson="2" 对齐；
# compat-3-3-0 显式接受 mongodb 3.3+ 兼容性约束（mongodb crate 强制）；rustls 选 TLS
mongodb = { version = "3", default-features = false, features = [
    "rustls-tls",
    "bson-2",
    "compat-3-3-0",
] }
bson = "2"

# 嵌入式存储
redb = "3"

# 异步运行时（GPUI 用 smol，sqlx/redis-rs 用 tokio，需桥接）
tokio = { version = "1", features = [
    "rt-multi-thread",
    "net",
    "macros",
    "sync",
    "process",
    "io-util",
    "fs",
    "time",
] }
tokio-stream = { version = "0.1", features = ["net"] }
smol = "2"
async-channel = "2.5"
async-trait = "0.1"
futures = "0.3"
async-std = "1"
async-tar = { version = "0.5", default-features = false }
async-compression = { version = "0.4", features = ["futures-io", "gzip"] }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
base64 = "0.22"
toml = "0.9"
# JumpServer REST API；使用 rustls，并读取系统证书库以兼容企业与内网证书链。
reqwest = { version = "0.13", default-features = false, features = [
    "form",
    "json",
    "multipart",
    "stream",
    "rustls-no-provider",
    "system-proxy",
] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
http = "1"
bytes = "1"
hyper = { version = "1.9", features = ["client", "http1"] }
hyper-util = { version = "0.1.11", features = ["tokio"] }

# API 测试工具的 gRPC 动态调用；Descriptor 和动态消息不生成业务专用 Rust 类型。
prost = "0.14.4"
prost-types = "0.14.4"
prost-reflect = { version = "0.16.5", features = ["serde"] }
protox = "0.9.1"
tonic = { version = "0.14.6", default-features = false, features = [
    "codegen",
    "tls-ring",
    "tls-native-roots",
    "transport",
] }
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tonic-reflection = { version = "0.14.6", default-features = false }

# 云对象存储：只启用 COS / OSS、Tokio executor 与 rustls HTTP transport。
opendal = { version = "0.58.1", default-features = false, features = [
    "auto-register-services",
    "executors-tokio",
    "http-transport-reqwest-rustls-no-provider",
    "services-cos",
    "services-oss",
] }
opendal-http-transport-reqwest = { version = "0.58.1", default-features = false, features = ["rustls-no-provider"] }
reqsign-core = "3.3.0"
reqsign-aliyun-oss = "3.1.4"

# GPUI Action 派生
schemars = "1"

# 系统文件对话框（导出 / 选目录）
rfd = "0.15"

# 文件系统监听（VCS 外部改动自动刷新）；7.0 与依赖树既有版本一致，不引入第二份
notify = "7"

# 本机性能和进程信息采集；保持与 AppWorkbench 相同的跨平台实现
sysinfo = "0.38.4"

# 错误处理
anyhow = "1"
thiserror = "2"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "local-time"] }

# 工具
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
parking_lot = "0.12"
# 加密剪贴历史深度搜索：并行兜底扫描 + 带密钥 Bloom token；均已存在于依赖树。
rayon = "1"
siphasher = "1"
directories = "6"
dunce = "1"
once_cell = "1"
# 图片缩略图（解码 + 缩放 + 编码 PNG）；GPUI 依赖树已含 image，零新增编译单元
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }

# SSH + SFTP：alacritty_terminal 提供 ANSI 内核与 Unix PTY / Windows ConPTY；
# russh-sftp 只处理系统 OpenSSH 子系统的结构化二进制协议。
alacritty_terminal = { version = "0.26", default-features = false }
russh-sftp = "2.3"

# 连接池缓存
dashmap = "6"

# Kafka 客户端；具体 crate 通过显式 feature 选择 librdkafka 的构建方式。
rdkafka = { version = "0.39", default-features = false }

# Docker Engine API；支持 Unix socket、Windows named pipe 和 providerless TLS。
bollard = { version = "0.21.1", default-features = false, features = [
    "http",
    "pipe",
    "ssl_providerless",
] }
# Kafka 纯 Rust 客户端；只由显式 pure-rust feature 拉入，不改变默认桌面构建。
rskafka = { version = "0.6", default-features = false, features = [
    "compression-gzip",
    "compression-lz4",
    "compression-snappy",
    "compression-zstd",
] }

# MQTT 客户端；基础设施 crate 默认不拉入 native 依赖，由应用组合根显式启用。
rumqttc = { version = "0.25.1", default-features = false, features = [
    "use-rustls-no-provider",
] }
# 本地 MQTT Broker；只在 native 工具构建中启用 TCP 监听，TLS/WS 由后续能力切片补齐。
oximqtt = { version = "0.23.0", default-features = false }

# 凭证加密
aes-gcm = "0.10"
zeroize = "1"
# 导出文件口令加密的密钥派生（sha2 / pbkdf2 已在 sqlx 依赖树内，零新增编译单元）
pbkdf2 = "0.12"
sha2 = "0.10"
rand = "0.9"
hex = "0.4"
semver = "1"

# 系统凭据库（具体原生后端由 infra-storage 按目标平台选择）
keyring = { version = "3" }

# SQL 补全：必须与 GPUI Kit 内部组件版本一致，否则 InputState 的 LSP 接口类型不兼容
lsp-types = { version = "0.97.0", features = ["proposed"] }
ropey = { version = "=2.0.0-beta.1", features = [
    "metric_lines_lf",
    "metric_utf16",
] }

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

# rustdoc：本地 cargo doc 静音；CI 不门禁 cargo doc
[workspace.lints.rustdoc]
broken_intra_doc_links = "allow"
private_intra_doc_links = "allow"
redundant_explicit_links = "allow"
invalid_html_tags = "allow"

# Release：最大化性能，编译变慢
# - lto=fat + codegen-units=1：跨 crate 全程 LTO，多挤 5-15% 性能
# - panic=abort：不生成栈展开代码
# - strip：剥离符号信息减小体积
[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
strip = true
panic = "abort"
incremental = false

# 本地日常构建：保留优化和 panic 策略，关闭全量 LTO 并启用增量编译。
[profile.release-fast]
inherits = "release"
opt-level = 2
codegen-units = 16
lto = false
strip = false
incremental = true

[profile.dev]
opt-level = 0
debug = 1
incremental = true

# librdkafka 的 CMake build script 将该依赖的 Rust profile 映射为 CMake
# 构建类型；使用 Release 让 MSVC native 代码与 Rust 默认动态 CRT 保持一致。
[profile.dev.package.rdkafka-sys]
opt-level = 1
debug = false
