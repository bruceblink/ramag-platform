services:
  kafka:
    image: apache/kafka:4.0.0
    container_name: ramag-kafka-test
    hostname: kafka
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "127.0.0.1:19092:19092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:19092 >/dev/null 2>&1
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s
    labels:
      ramag.test-suite: "true"
      ramag.test-component: "kafka"

  connect:
    image: apache/kafka:4.0.0
    container_name: ramag-kafka-connect-test
    hostname: connect
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:18083:8083"
    volumes:
      - ./connect-distributed.properties:/etc/kafka/connect-distributed.properties:ro
    command:
      - /opt/kafka/bin/connect-distributed.sh
      - /etc/kafka/connect-distributed.properties
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O - http://127.0.0.1:8083/ >/dev/null 2>&1
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s
    labels:
      ramag.test-suite: "true"
      ramag.test-component: "kafka-connect"

  metrics:
    image: nginx:1.27-alpine
    container_name: ramag-kafka-metrics-test
    hostname: metrics
    ports:
      - "127.0.0.1:19100:80"
    volumes:
      - ./fixtures/broker-metrics.prom:/usr/share/nginx/html/metrics:ro
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O - http://127.0.0.1/metrics | grep -q ramag_kafka_broker_cpu_usage_percent
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 5s
    labels:
      ramag.test-suite: "true"
      ramag.test-component: "kafka-broker-metrics-fixture"

  ksqldb:
    image: confluentinc/cp-ksqldb-server:8.3.1
    container_name: ramag-kafka-ksqldb-test
    hostname: ksqldb
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KSQL_BOOTSTRAP_SERVERS: kafka:9092
      KSQL_LISTENERS: http://0.0.0.0:8088
      KSQL_KSQL_SERVICE_ID: ramag_ksqldb_test_
      KSQL_KSQL_STREAMS_REPLICATION_FACTOR: 1
      KSQL_KSQL_INTERNAL_TOPIC_REPLICAS: 1
      KSQL_KSQL_SINK_REPLICAS: 1
      KSQL_KSQL_LOGGING_PROCESSING_TOPIC_REPLICATION_FACTOR: 1
      KSQL_KSQL_LOGGING_PROCESSING_STREAM_AUTO_CREATE: "true"
      KSQL_KSQL_QUERY_PULL_TABLE_SCAN_ENABLED: "true"
    ports:
      - "127.0.0.1:18088:8088"
    healthcheck:
      test:
        - CMD-SHELL
        - |-
          exec 3<>/dev/tcp/127.0.0.1/8088
          printf 'GET /info HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          grep -q version <&3
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 30s
    labels:
      ramag.test-suite: "true"
      ramag.test-component: "ksqldb"

volumes:
  kafka-data:
    name: ramag-kafka-test-data
    labels:
      ramag.test-suite: "true"

networks:
  default:
    name: ramag-kafka-test
    labels:
      ramag.test-suite: "true"
