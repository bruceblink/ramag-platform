services:
  openssh:
    build:
      context: .
      dockerfile: Dockerfile
    image: ramag-ssh-test:local
    container_name: ramag-ssh-test
    ports:
      - "127.0.0.1:12222:22"
    volumes:
      - ./fixtures/authorized_keys:/run/ramag-authorized_keys:ro
    healthcheck:
      test:
        - CMD-SHELL
        - test -s /run/sshd.pid && kill -0 $$(cat /run/sshd.pid)
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 3s
    labels:
      ramag.test-suite: "ssh"
      ramag.test-component: "openssh-sftp"
