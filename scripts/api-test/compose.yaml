services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ramag-api-http-test:python-3.12.11-alpine-3.22
    container_name: ramag-api-http-test
    restart: unless-stopped
    ports:
      - "127.0.0.1:18089:8080"
      - "127.0.0.1:18091:8443"
    volumes:
      - ./tls:/app/tls:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 2s
    labels:
      ramag.test-suite: "true"
networks:
  default:
    name: ramag-api-http-test
    labels:
      ramag.test-suite: "true"
