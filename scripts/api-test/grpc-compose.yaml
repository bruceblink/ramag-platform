services:
  grpc:
    build:
      context: ./grpc
      dockerfile: Dockerfile
    image: ramag-api-grpc-test:rust-1.91.0-bookworm
    container_name: ramag-api-grpc-test
    restart: unless-stopped
    ports:
      - "127.0.0.1:18090:50051"
      - "127.0.0.1:18092:50052"
    volumes:
      - ./tls:/app/tls:ro
    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -c
        - </dev/tcp/127.0.0.1/50051
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 2s
    labels:
      ramag.test-suite: "true"
  proxy:
    build:
      context: .
      dockerfile: proxy.Dockerfile
    image: ramag-api-proxy-test:python-3.12.11-alpine-3.22
    container_name: ramag-api-grpc-proxy-test
    restart: unless-stopped
    environment:
      PROXY_TARGET_SERVICE: grpc
      PROXY_TARGET_PORTS: "18090:50051,18092:50052"
      PROXY_USERNAME: proxy-user
      PROXY_PASSWORD: proxy-secret
    ports:
      - "127.0.0.1:18094:8081"
    depends_on:
      - grpc
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import socket; socket.create_connection(('127.0.0.1', 8081), timeout=2).close()
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 2s
    labels:
      ramag.test-suite: "true"
networks:
  default:
    name: ramag-api-grpc-test
    labels:
      ramag.test-suite: "true"
