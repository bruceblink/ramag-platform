[package]
name = "ramag-app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Ramag 应用层：Use Cases + ToolRegistry，编排 Domain，被 UI 调用"

[[bin]]
name = "ramag-plugin-helper"
path = "src/bin/ramag-plugin-helper.rs"
test = false

[lints]
workspace = true

[dependencies]
ramag-domain = { workspace = true }

# 日志
tracing = { workspace = true }

# 插件生命周期诊断
thiserror = { workspace = true }

# 并发数据结构（ToolRegistry 用 RwLock）
parking_lot = { workspace = true }

# 导出工具用
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
aes-gcm = { workspace = true }
pbkdf2 = { workspace = true }
sha2 = { workspace = true }
ring = { workspace = true }

# 剪贴条目时间戳（workspace 既有依赖）
chrono = { workspace = true }

# 剪贴图片缩略图生成
image = { workspace = true }

# 缩略图工作线程桥接（oneshot，与 Storage/Git 同款模式；workspace 既有依赖）
futures = { workspace = true }
smol = { workspace = true }
tokio = { workspace = true }
semver = { workspace = true }

# 本地插件 tar.gz 归档的安全扫描和解包
async-tar = { workspace = true }
async-compression = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }

[target.'cfg(unix)'.dependencies]
# Unix 进程组终止需要向负的 PGID 发送信号；Windows 使用独立 Job Object 切片。
libc = "0.2"
# 当前进程资源基线采样。
ramag-infra-system = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Windows 插件进程树清理使用 Job Object；仅由进程外宿主直接持有。
windows = { version = "0.57", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
# 当前进程资源基线采样。
ramag-infra-system = { workspace = true }

[dev-dependencies]
# decide_capture 等纯逻辑测试无需额外 mock；保留位以备扩展
async-std = { workspace = true }
async-trait = { workspace = true }
ramag-infra-storage = { workspace = true }
rustls = { workspace = true }
http = { workspace = true }
tempfile = "3"
# 按库导出 / 导入端到端集成测试（tests/transfer_live.rs）：连真实四库容器
ramag-infra-mysql = { workspace = true }
ramag-infra-postgres = { workspace = true }
ramag-infra-sqlite = { workspace = true }
ramag-infra-redis = { workspace = true }
ramag-infra-mongodb = { workspace = true }
# 本机对象存储覆盖目标集成测试使用真实 S3 兼容驱动。
ramag-infra-object-storage = { workspace = true }
