[package]
name = "ramag-infra-kafka"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Ramag Kafka 驱动基线，封装 rdkafka/librdkafka"

[lints]
workspace = true

[features]
default = []
cmake-build = ["dep:rdkafka", "rdkafka/cmake-build"]
kafka-tls = ["cmake-build", "rdkafka/ssl-vendored"]
# SASL 构建依赖 librdkafka 的 TLS 支持，因此一起启用 vendored OpenSSL。
kafka-sasl = ["rdkafka/sasl", "kafka-tls"]
tls = ["kafka-tls"]
sasl = ["kafka-sasl"]
# 纯 Rust 路径只在显式启用时构建，默认构建仍不拉入任何 Kafka 客户端。
pure-rust = ["dep:rskafka", "dep:tokio"]

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true }
ramag-domain = { workspace = true }
rdkafka = { workspace = true, optional = true, features = ["tokio"] }
rskafka = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["blocking"] }
regex = { workspace = true }
serde_json = { workspace = true }
smol = { workspace = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# 集成测试进程本身也是 HTTP 客户端组合根，需在构建 reqwest 客户端前安装 provider。
rustls = { workspace = true }
